[project]
name = "openroute-agents"
version = "0.1.0"
description = "Agentes de Paygent: Asistente, Inventario, Intención y Guardián"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.10",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
