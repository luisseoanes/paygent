<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Maquetas Paygent</title>
<style>
body{margin:0;background:#f3f2ee;font-family:system-ui,sans-serif;color:#1f1f22}
.lamina{width:1920px;height:1080px;box-sizing:border-box;padding:64px 80px;display:flex;flex-direction:column}
h1{font-size:52px;font-weight:300;letter-spacing:-.03em;margin:0}
p.sub{font-size:24px;color:#626368;margin:10px 0 0}
.fila{flex:1;display:flex;align-items:center;justify-content:center;gap:40px}
.cel{width:272px;border-radius:44px;background:#1f1f22;padding:12px;box-shadow:0 30px 60px -30px #0007}
.cel img{display:block;width:100%;border-radius:34px}
.cel figcaption,.nav figcaption{text-align:center;font-size:20px;margin-top:22px;color:#1f1f22}
figure{margin:0;display:flex;flex-direction:column;align-items:center}
.nav{width:820px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 30px 60px -30px #0007}
.barra{height:38px;background:#e6e4de;display:flex;align-items:center;gap:8px;padding:0 14px}
.barra i{width:12px;height:12px;border-radius:50%;background:#c9c6be}
.barra span{margin-left:16px;background:#fff;border-radius:8px;padding:4px 14px;font-size:14px;color:#626368}
.nav img{display:block;width:100%}
</style></head><body>

<figure><div class="cel"><img src="capturas/billetera-movil.png"></div><figcaption>Beneficiaria · su saldo</figcaption></figure>

<figure><div class="cel"><img src="capturas/tendero-movil.png"></div><figcaption>Tendero · cobra vales</figcaption></figure>
<figure><div class="cel"><img src="capturas/celular-movil.png"></div><figcaption>Celular de teclas · SMS</figcaption></figure>
</div></section>

<div class="fila">
<figure class="nav" style="width:1100px"><div class="barra"><i></i><i></i><i></i><span>paygent.up.railway.app/cuenta</span></div><img src="capturas/cuenta-pc.png"></figure>
</div></section>
